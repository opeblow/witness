version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      polkadot:
        patterns: ['@polkadot/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', 'vite', '@vitejs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/notary
    schedule:
      interval: weekly
