# Version-update PRs are paused (limit 0) during the Hacker House code freeze.
# Security updates still open automatically. Raise the limits to resume.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      polkadot:
        patterns: ['@polkadot/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vitest', 'vite', '@vitejs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /services/notary
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
