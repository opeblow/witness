name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security issues, do not use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /verify
        2. Drop the attached image
        3. ...
    validations:
      required: true
  - type: input
    id: capture
    attributes:
      label: Witness id or content hash
      description: If the problem concerns a specific capture.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - Verification result
        - Notary
        - Contracts
        - SDK or core
        - Documentation
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS and commit
      placeholder: Chrome 140, Android 16, main@abc1234
