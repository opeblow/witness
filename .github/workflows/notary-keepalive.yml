name: Keep notary awake

# Render's free tier sleeps after 15 idle minutes; a cold start makes the first seal hang.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping notary
        run: curl -fsS -m 120 --retry 2 https://witness-notary.onrender.com/healthz
